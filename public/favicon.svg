<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="favStreamGrad" x1="0%" y1="70%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="favSubStreamGrad" x1="0%" y1="55%" x2="100%" y2="35%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- Background container for tab visibility -->
  <rect width="100" height="100" rx="22" fill="url(#favBgGrad)" />

  <!-- Main 30-deg Ribbon -->
  <path
    d="M 0 66 C 25 56, 42 66, 68 46 C 82 34, 92 26, 100 20 L 100 46 C 85 58, 65 72, 40 78 C 20 82, 10 80, 0 84 Z"
    fill="url(#favStreamGrad)"
  />
  <!-- Overlapping Soft Layer -->
  <path
    d="M 0 52 C 25 44, 45 54, 72 36 C 86 26, 94 18, 100 12 L 100 24 C 85 36, 65 52, 38 64 C 18 70, 8 68, 0 70 Z"
    fill="url(#favSubStreamGrad)"
  />

  <!-- Center Large Star (Outlined 5.2px) -->
  <path
    d="M 50 16 C 50 38, 59 47, 81 47 C 59 47, 50 56, 50 78 C 50 56, 41 47, 19 47 C 41 47, 50 38, 50 16 Z"
    stroke="#ffffff"
    stroke-width="5.2"
    stroke-linejoin="round"
  />

  <!-- Top-Left Star (Outlined 3.8px) -->
  <path
    d="M 20 6 C 20 17, 24 21, 35 21 C 24 21, 20 25, 20 36 C 20 25, 16 21, 5 21 C 16 21, 20 17, 20 6 Z"
    stroke="#ffffff"
    stroke-width="3.8"
    stroke-linejoin="round"
  />

  <!-- Bottom-Right Star (Outlined 3.8px) -->
  <path
    d="M 80 58 C 80 68, 84 72, 94 72 C 84 72, 80 76, 80 86 C 80 76, 76 72, 66 72 C 76 72, 80 68, 80 58 Z"
    stroke="#ffffff"
    stroke-width="3.8"
    stroke-linejoin="round"
  />

  <!-- Satellite dots (x:11, y:62 / x:88, y:22 / x:36, y:74) -->
  <circle cx="11" cy="62" r="2.2" fill="#ffffff" />
  <circle cx="88" cy="22" r="2.2" fill="#ffffff" />
  <circle cx="36" cy="74" r="2.0" fill="#ffffff" />
</svg>
